      - name: Tag image as latest
        run: |
          RELEASE_TAG="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          SOURCE_IMAGE="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${RELEASE_TAG}"
          
          # Get the image manifest for the release tag
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$RELEASE_TAG \
            --query 'images[0].imageManifest' \
            --output text \
            --region $AWS_REGION)
          
          if [ -z "$MANIFEST" ]; then
            echo "Failed to get manifest for image $SOURCE_IMAGE"
            exit 1
          fi
          
          # Tag it as latest
          aws ecr put-image \
            --repository-name $ECR_REPOSITORY \
            --image-tag latest \
            --image-manifest "$MANIFEST" \
            --region $AWS_REGION
          
          echo "Successfully tagged $SOURCE_IMAGE as latest"
