name: Publish
run-name: Publish - ${{ github.head_ref || github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'development'
  workflow_call:
    outputs:
      image-uri:
        description: Built image URI
        value: ${{ jobs.publish.outputs.image-uri }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image-uri: ${{ steps.build-image.outputs.image-uri }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::062073933793:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: eu-west-2

      - name: Check GetCallerIdentity
        run: |
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        id: build-image
        run: |
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ECR_REPOSITORY is not set"
            exit 1
          fi

          RELEASE_TAG="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${RELEASE_TAG}"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          docker build --no-cache --tag "$IMAGE_URI" .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image-uri }}
          format: 'table'
          exit-code: '1' # Fails the build if vulnerabilities are found
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          pkg-relationships: 'direct' # Excludes transitive dev dependencies

      - name: Run Trivy scanner (JSON output)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image-uri }}
          format: 'json'
          output: 'trivy-results.json'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
          pkg-relationships: 'direct' # Excludes transitive dev dependencies

      - name: Summarize vulnerability counts
        if: always()
        run: |
          echo "## Trivy Vulnerability Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json)

          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CRITICAL | $CRITICAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HIGH     | $HIGH |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Breakdown by package" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Severity | CVE | Installed | Fixed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|----------|-----|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]?.Vulnerabilities[]? | "| \(.PkgName) | \(.Severity) | \(.VulnerabilityID) | \(.InstalledVersion) | \(.FixedVersion // "-") |"' trivy-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Push Docker image
        run: |
          docker push "${{ steps.build-image.outputs.image-uri }}"
