      - name: Tag image as latest
        run: |
          SOURCE_IMAGE="${{ steps.build-image.outputs.image-uri }}"
          LATEST_IMAGE="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest"
          
          # Get the image manifest
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$(echo $SOURCE_IMAGE | cut -d: -f2) \
            --query 'images[0].imageManifest' \
            --output text)
          
          # Tag it as latest
          aws ecr put-image \
            --repository-name $ECR_REPOSITORY \
            --image-tag latest \
            --image-manifest "$MANIFEST"
          
          echo "Tagged $SOURCE_IMAGE as $LATEST_IMAGE"
